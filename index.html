<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Keywords lead, attribution follows as a suffix rather than a possessive prefix: the framework's
         name is "9-Pillar Engineer Growth Framework" and the credit is appended, so the highest-value
         position in the title is not spent on a name nobody searches for. -->
    <title>9-Pillar Engineer Growth Framework — Jasper Loo</title>
    <meta
      name="description"
      content="A spider chart to measure software engineering mastery, identify core interests, and guide career paths. Supported by a 45-point competency matrix across 5 proficiency levels. By Jasper Loo Zhu Hang."
    />
    <meta name="author" content="Jasper Loo Zhu Hang" />
    <!-- THE THREE SHORT-NAME SLOTS, all carrying SITE_COPY.shortName. Change them together.
         `application-name` is the spec's "short free-form string naming the web application" — pinned sites
         and generic app-name hints read it, NOT the home-screen icon.
         The icon label is per-platform: `short_name` in manifest.json on Android, and
         `apple-mobile-web-app-title` on iOS, which otherwise falls back to <title> and truncates it. -->
    <meta name="application-name" content="9-Pillar EGF" />
    <meta name="apple-mobile-web-app-title" content="9-Pillar EGF" />

    <!-- LAUNCH FULLSCREEN FROM THE iOS HOME SCREEN, the counterpart to `display: standalone` in manifest.json
         (which only Android reads). Without this iOS opens the app inside Safari's chrome, and the consequence is
         not just cosmetic: `env(safe-area-inset-*)` reports 0 whenever browser UI is present, because Safari's own
         bottom bar is already clearing the home indicator. So the bottom nav's `pb-[env(safe-area-inset-bottom)]`
         (see AppBottomNav) silently resolves to nothing and only starts doing its job once this tag exists.

         Trade-off, deliberately accepted: standalone mode has no Safari back/forward or share button, so in-app
         navigation is whatever the app provides. This app is two tabs and a footer, so there is nothing to go
         "back" to.

         ONLY AFFECTS ICONS ADDED AFTER THIS SHIPS. iOS bakes the launch mode into the home-screen shortcut at the
         moment it is created, so an existing icon keeps opening in Safari until it is removed and re-added. Worth
         knowing before concluding the tag did not work. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black-translucent` would extend the page under the status bar and require a top safe-area inset on the
         header to compensate; `default` keeps the status bar as its own opaque band, so the header needs no
         `env(safe-area-inset-top)` handling. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="canonical" href="https://zhuhang-jasper.github.io/egf/" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="9-Pillar Engineer Growth Framework" />
    <meta property="og:title" content="9-Pillar Engineer Growth Framework — Jasper Loo" />
    <meta
      property="og:description"
      content="A spider chart to measure software engineering mastery, identify core interests, and guide career paths. Supported by a 45-point competency matrix across 5 proficiency levels. By Jasper Loo Zhu Hang."
    />
    <meta property="og:url" content="https://zhuhang-jasper.github.io/egf/" />
    <meta property="og:image" content="https://zhuhang-jasper.github.io/egf/social.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="9-Pillar Engineer Growth Framework — a competency spider chart." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="9-Pillar Engineer Growth Framework — Jasper Loo" />
    <meta
      name="twitter:description"
      content="A spider chart to measure software engineering mastery, identify core interests, and guide career paths. Supported by a 45-point competency matrix across 5 proficiency levels. By Jasper Loo Zhu Hang."
    />
    <meta name="twitter:image" content="https://zhuhang-jasper.github.io/egf/social.png" />
    <meta name="twitter:image:type" content="image/png" />
    <meta name="twitter:image:alt" content="9-Pillar Engineer Growth Framework — a competency spider chart." />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- SPA deep-link decoder: restores the real path from the ?/ redirect set by
         public/404.html, before the app bundle reads window.location. See 404.html. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
